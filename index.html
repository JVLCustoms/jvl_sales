<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <!-- SELL INTERFACE -->
        <div id="sell-container" class="app-container" style="display: none;">
            <div class="header">
                <h1>💸 Venta de Materiales</h1>
                <div class="header-controls">
                    <div class="total-container">
                        <span>Total: $<span id="sell-total-value">0</span></span>
                    </div>
                    <button id="close-sell-btn"><i class="fas fa-times"></i></button>
                </div>
            </div>

            <div class="content">
                <div class="items-grid" id="sell-items-container">
                    <!-- Items will be generated dynamically -->
                </div>
            </div>

            <div class="footer">
                <button id="sell-selected-btn" class="action-btn">
                    <i class="fas fa-hand-holding-usd"></i> Vender Seleccionados
                </button>
            </div>
        </div>
    </div>
    
    <!-- Template for sell items -->
    <template id="sell-item-template">
        <div class="item" data-item="">
            <div class="item-img-container">
                <img src="" alt="Item" class="item-img">
                <div class="item-count">x0</div>
                <div class="item-price-badge">$0</div>
            </div>
            <div class="item-info">
                <div class="item-name"></div>
                <div class="item-price">Precio: $0 c/u</div>
                <div class="item-controls">
                    <button class="quantity-btn decrease"><i class="fas fa-minus"></i></button>
                    <input type="number" class="quantity-input" value="0" min="0" max="0">
                    <button class="quantity-btn increase"><i class="fas fa-plus"></i></button>
                </div>
            </div>
            <div class="item-select">
                <input type="checkbox" class="select-item">
            </div>
        </div>
    </template>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
