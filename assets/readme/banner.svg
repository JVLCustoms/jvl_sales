<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="JVL Sales — NPC buyers for FiveM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080d"/><stop offset="0.6" stop-color="#0b1522"/><stop offset="1" stop-color="#101c2b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.48" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.18"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.02" stop-color="#0b2545" stop-opacity="0"/><stop offset="0.25" stop-color="#0ea5e9"/>
      <stop offset="0.45" stop-color="#e9eef5"/><stop offset="0.62" stop-color="#22c55e"/>
      <stop offset="0.95" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="340" rx="24"/></clipPath>

  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
    <rect x="0" y="0" width="1200" height="2" fill="url(#topline)"/>
    <rect x="0" y="338" width="1200" height="2" fill="url(#topline)" opacity="0.5"/>

    <g transform="translate(640 50)">
      <rect x="0" y="170" width="460" height="70" rx="6" fill="#3f2a14" stroke="#ffffff1a"/>
      <rect x="0" y="164" width="460" height="10" rx="3" fill="#57391c"/>
      <!-- crate of scrap -->
      <g transform="translate(30 90)">
        <rect x="0" y="0" width="130" height="76" rx="4" fill="#78350f" stroke="#a16207" stroke-width="2"/>
        <line x1="0" y1="25" x2="130" y2="25" stroke="#a16207" stroke-width="2"/><line x1="0" y1="50" x2="130" y2="50" stroke="#a16207" stroke-width="2"/>
        <rect x="14" y="-18" width="40" height="22" rx="3" fill="#94a3b8" transform="rotate(-12 34 -7)"/>
        <rect x="60" y="-24" width="54" height="16" rx="3" fill="#64748b" transform="rotate(9 87 -16)"/>
        <circle cx="70" cy="-6" r="10" fill="#475569"/>
      </g>
      <!-- scale -->
      <g transform="translate(240 90)">
        <rect x="-6" y="0" width="12" height="74" fill="#475569"/><rect x="-40" y="70" width="80" height="8" rx="3" fill="#334155"/>
        <g><animateTransform attributeName="transform" type="rotate" values="-6;6;-6" dur="3s" repeatCount="indefinite"/>
          <rect x="-70" y="-4" width="140" height="6" rx="3" fill="#94a3b8"/>
          <path d="M-80 2 L-50 2 L-56 22 L-74 22 Z" fill="#22c55e88"/><path d="M50 2 L80 2 L74 22 L56 22 Z" fill="#22c55e88"/></g>
      </g>
      <!-- receipt -->
      <g transform="translate(340 20) rotate(4)">
        <path d="M0 0 H104 V150 L94 144 L84 150 L74 144 L64 150 L54 144 L44 150 L34 144 L24 150 L14 144 L0 150 Z" fill="#e9eef5"/>
        <text x="52" y="20" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="700" fill="#0b1522">RECIBO</text>
        <text x="8" y="44" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#334155">Scrap x10</text><text x="96" y="44" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#334155">$250</text>
        <text x="8" y="60" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#334155">Copper x4</text><text x="96" y="60" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#334155">$120</text>
        <line x1="8" y1="72" x2="96" y2="72" stroke="#94a3b8" stroke-dasharray="3 3"/>
        <text x="8" y="92" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="700" fill="#15803d">TOTAL</text><text x="96" y="92" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="700" fill="#15803d">$370</text>
        <rect x="18" y="106" width="68" height="22" rx="4" fill="#22c55e"><animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/></rect>
        <text x="52" y="121" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="800" fill="#05280f">VENDIDO</text>
      </g>
    </g>
    <g font-family="'Segoe UI', Arial, sans-serif">
      <text x="56" y="92" font-size="15" font-weight="600" letter-spacing="4" fill="#22c55e">JVL MEDIACODE</text>
      <text x="56" y="152" font-size="58" font-weight="800" fill="#eef3f9">JVL Sales</text>
      <text x="58" y="190" font-size="19" fill="#9fb0c3">NPC buyers that pay a fixed price for your items</text>
      <text x="58" y="216" font-size="19" fill="#9fb0c3">Cart sale · one click · server prices</text>
    </g>
    <g font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">
      <rect x="56" y="246" width="114" height="26" rx="13" fill="#22c55e22" stroke="#22c55e"/><text x="113.0" y="263" text-anchor="middle" fill="#e9eef5">FIXED PRICES</text><rect x="178" y="246" width="90" height="26" rx="13" fill="#22c55e22" stroke="#22c55e"/><text x="223.0" y="263" text-anchor="middle" fill="#e9eef5">CART SALE</text><rect x="276" y="246" width="122" height="26" rx="13" fill="#22c55e22" stroke="#22c55e"/><text x="337.0" y="263" text-anchor="middle" fill="#e9eef5">ANY FRAMEWORK</text><rect x="406" y="246" width="106" height="26" rx="13" fill="#22c55e22" stroke="#22c55e"/><text x="459.0" y="263" text-anchor="middle" fill="#e9eef5">SERVER-SIDE</text>
    </g>
  </g>
</svg>
