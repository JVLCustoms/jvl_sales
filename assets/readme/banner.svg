<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="JVL Sales — NPC buyers for FiveM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04070c"/>
      <stop offset="1" stop-color="#0b1a2e"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e9eef5"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.02" stop-color="#0b2545" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#0b2545"/>
      <stop offset="0.32" stop-color="#0ea5e9"/>
      <stop offset="0.44" stop-color="#e9eef5"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="0.92" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ping" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f87171" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
    <style>
      .orb { animation: drift 9s ease-in-out infinite alternate; }
      .orb2 { animation: drift 12s ease-in-out infinite alternate-reverse; }
      .float { animation: float 5s ease-in-out infinite; }
      .ring { animation: ring 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .hop { animation: hop 9s steps(1) infinite; }
      .title { font: 800 70px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -1.5px; }
      .sub { font: 500 23px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #bae6fd; }
      .chipt { font: 600 15px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #e0f2fe; }
      .lbl { font: 600 12px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #eef3f9; }
      .price { font: 700 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #34d399; }
      @keyframes drift { from { transform: translate(0,0); } to { transform: translate(60px,-30px); } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes ring { from { transform: scale(0.4); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }
      @keyframes hop { 0% { transform: translate(0,0); } 33% { transform: translate(-120px,40px); } 66% { transform: translate(60px,70px); } }
    </style>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <circle class="orb" cx="930" cy="170" r="260" fill="url(#glow)"/>
  <circle class="orb2" cx="120" cy="330" r="200" fill="url(#glow)" opacity="0.6"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#line)"/>

  <!-- Hooded dealer icon -->
  <g transform="translate(74,82)">
    <path d="M30 4 C14 4 6 18 6 30 V60 H54 V30 C54 18 46 4 30 4 Z" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round"/>
    <rect x="18" y="26" width="24" height="7" rx="3" fill="#e9eef5"/>
  </g>

  <text class="title" x="150" y="140" fill="url(#txt)">JVL Sales</text>
  <text class="sub" x="74" y="188">NPC buyers that pay a fixed price for your items.</text>

  <g transform="translate(74,222)">
    <rect width="150" height="38" rx="19" fill="#0ea5e9" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text class="chipt" x="75" y="24.5" text-anchor="middle">Fixed prices</text>
    <rect x="164" width="150" height="38" rx="19" fill="#f87171" fill-opacity="0.14" stroke="#f87171" stroke-opacity="0.5"/>
    <text class="chipt" x="239" y="24.5" text-anchor="middle">Cart sale</text>
    <rect x="328" width="150" height="38" rx="19" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.5"/>
    <text class="chipt" x="403" y="24.5" text-anchor="middle">Any framework</text>
    <rect x="492" width="150" height="38" rx="19" fill="#cbd5e1" fill-opacity="0.12" stroke="#cbd5e1" stroke-opacity="0.5"/>
    <text class="chipt" x="567" y="24.5" text-anchor="middle">Server-side</text>
  </g>

  <!-- Map with a moving dealer -->
  <g transform="translate(800,50)"><g class="float">
    <rect width="330" height="240" rx="18" fill="#0a1018" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M20 180 Q90 120 150 150 T310 90" fill="none" stroke="#1e4f8f" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
    <path d="M40 40 L120 90 L100 200 M200 30 L240 210 M260 60 L300 150" fill="none" stroke="#16212f" stroke-width="6" stroke-linecap="round"/>
    <g class="hop">
      <circle class="ring" cx="220" cy="100" r="26" fill="url(#ping)"/>
      <circle cx="220" cy="100" r="9" fill="#f87171" stroke="#fff" stroke-width="2"/>
    </g>
    <rect x="16" y="200" width="150" height="26" rx="13" fill="#04070c" fill-opacity="0.7" stroke="#34d399" stroke-opacity="0.4"/>
    <text class="lbl" x="30" y="217">Scrap Metal</text>
    <text class="price" x="152" y="218" text-anchor="end">$25</text>
  </g></g>
</svg>
